# Servido pelo nginx da imagem final (veja Dockerfile).
#
# O app é estático, mas a persistência (cena, imagens e biblioteca) vive no
# MySQL, que só é acessível pela API (server/index.mjs) rodando no mesmo
# container. Por isso `/api` é encaminhado para 127.0.0.1:3001: o navegador
# nunca fala com o banco, só com este mesmo origin.
server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # imagens vão como dataURL dentro do JSON, então o corpo pode ser grande
  client_max_body_size 200m;

  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # uploads de imagens grandes: não bufferiza e não corta por timeout
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
