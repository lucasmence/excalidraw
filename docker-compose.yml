services:
  excalidraw:
    image: ghcr.io/lucasmence/excalidraw:latest
    container_name: excalidraw
    ports:
      - "20140:80"
    restart: unless-stopped
    environment:
      - ALLOW_ACCOUNT_CREATION=false
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: excalidraw-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  collab:
    image: ghcr.io/lucasmence/excalidraw-collab:latest
    container_name: excalidraw-collab
    ports:
      - "20141:3002"
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - COLLAB_PORT=3002
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost:20140

volumes:
  mysql-data:
